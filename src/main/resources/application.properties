spring.application.name=lawconnect
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lawconnect
spring.datasource.username=lawconnect_user
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktZm9yLWpzb24td2ViLXRva2Vucy0yNTY=
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

eureka.client.enabled=false
spring.devtools.restart.enabled=false

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

# Actuator
management.endpoints.web.exposure.include=*

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.enabled=false

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===== OAuth2 Google =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-secret}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/oauth2/callback/google
spring.security.oauth2.client.registration.google.scope=email,profile

# ===== Redirections post-login =====
app.oauth2.user-redirect-uri=http://localhost:5173/dashboard
app.oauth2.admin-redirect-uri=http://localhost:5173/admin/dashboard